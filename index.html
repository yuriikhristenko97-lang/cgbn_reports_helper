<title>ЦГБ-Н — Доклады в рацию</title>

<style>
:root{
  --bg:#eef4f7;
  --card:#fff;
  --text:#17252d;
  --muted:#667780;
  --accent:#238b8b;
  --accent2:#176b70;
  --border:#d7e2e7;
  --shadow:0 6px 20px rgba(28,55,65,.08);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:linear-gradient(135deg,#edf5f7,#f7fafb);
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
}

header{
  background:linear-gradient(135deg,#176b70,#299b98);
  color:#fff;
  padding:14px 18px;
  box-shadow:0 4px 15px rgba(0,0,0,.10);
}

.header-inner{
  max-width:1150px;
  margin:auto;
}

h1{
  margin:0 0 3px;
  font-size:22px;
}

.subtitle{
  opacity:.9;
  font-size:12px;
}

.container{
  max-width:1150px;
  margin:14px auto;
  padding:0 14px;
}

.panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  box-shadow:var(--shadow);
  margin-bottom:12px;
}

/* Верхняя панель */

.controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.controls + .controls{
  margin-top:9px !important;
}

label{
  font-size:12px;
  font-weight:700;
  color:var(--muted);
  display:block;
  margin-bottom:4px;
}

input,
select,
textarea{
  width:100%;
  padding:9px 10px;
  border:1px solid var(--border);
  border-radius:8px;
  font-size:14px;
  outline:none;
  background:#fff;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 2px rgba(35,139,139,.10);
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:10px;
}

button{
  border:0;
  border-radius:8px;
  padding:8px 12px;
  font-weight:700;
  cursor:pointer;
  transition:.15s;
}

button:hover{
  transform:translateY(-1px);
}

.primary{
  background:var(--accent);
  color:white;
}

.secondary{
  background:#e9f2f3;
  color:#176b70;
}

.danger{
  background:#fbe8e8;
  color:#a43d3d;
}

/* Свой доклад */

.custom-grid{
  display:grid;
  grid-template-columns:1fr 2fr;
  gap:10px;
}

textarea{
  min-height:85px;
  resize:vertical;
}

/* Категории */

.category{
  margin:7px 0;
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  background:#fff;
}

.category-header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:11px 13px;
  background:#f7fbfb;
  color:var(--text);
  text-align:left;
  font-size:14px;
  cursor:pointer;
  border-radius:0;
}

.category-header:hover{
  background:#eef7f7;
  transform:none;
}

.category-header-left{
  display:flex;
  align-items:center;
  gap:8px;
}

.category-arrow{
  width:19px;
  height:19px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:5px;
  background:#e3f0f1;
  color:var(--accent2);
  font-size:11px;
  transition:.2s;
}

.category.open .category-arrow{
  transform:rotate(90deg);
}

.category-count{
  color:var(--muted);
  font-size:11px;
  font-weight:normal;
}

.category-content{
  display:none;
  padding:3px 9px 8px;
}

.category.open .category-content{
  display:block;
}

/* Доклады */

.report{
  border:1px solid var(--border);
  border-radius:8px;
  padding:9px;
  margin:6px 0;
  background:#fbfdfd;
}

.report-title{
  font-weight:700;
  margin-bottom:5px;
  font-size:13px;
}

.report-text{
  background:#f2f7f8;
  border-radius:7px;
  padding:8px;
  line-height:1.4;
  white-space:pre-wrap;
  font-size:13px;
}

.report-actions{
  display:flex;
  gap:6px;
  margin-top:6px;
}

.report-actions button{
  font-size:12px;
  padding:7px 10px;
}

/* Сохранённые доклады */

.saved{
  margin-top:10px;
}

.saved-item{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
  padding:8px;
  border:1px solid var(--border);
  border-radius:8px;
  margin:5px 0;
}

.hidden{
  display:none!important;
}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  background:#17252d;
  color:white;
  padding:10px 14px;
  border-radius:9px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:999;
  font-size:13px;
}

.toast.show{
  opacity:1;
}

.copied{
  background:#267b59!important;
  color:#fff!important;
}

footer{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  padding:5px 0 20px;
}

/* Планшет / телефон */

@media(max-width:850px){

@media(max-width:600px){

  .panel{

  }

  h1{

  }
}

const ids = [
  "tag",
  "call",
  "partners",
  "post",
  "route",
  "faction",
  "result",
  "gender"
];


function vals(){

  const o={};

  ids.forEach(id=>{
    o[id]=document.getElementById(id).value.trim();
  });

  return o;
}


function fill(text){

  const v=vals();

  return text
    .replaceAll("{TAG}",v.tag||"ТЭГ")
    .replaceAll("{CALL}",v.call||"Номер")
    .replaceAll("{PARTNERS}",v.partners||"если есть")
    .replaceAll("{POST}",v.post||"Название")
    .replaceAll("{ROUTE}",v.route||"Номер маршрута")
    .replaceAll("{FACTION}",v.faction||"Выбранная фракция")
    .replaceAll("{RESULT}",v.result);

}


function render(){

  const gender=document.getElementById("gender").value;
  const q=document.getElementById("search").value.toLowerCase().trim();

  const root=document.getElementById("reports");

  root.innerHTML="";


  data[gender].forEach(([cat,items])=>{

    const matched=items
      .map((x,i)=>[x,i])
      .filter(([x])=>
        (cat+" "+x).toLowerCase().includes(q)
      );


    if(!matched.length)return;


    const sec=document.createElement("div");

    sec.className="category";


    const header=document.createElement("button");

    header.className="category-header";

    header.innerHTML=`

      <div class="category-header-left">

        <span class="category-arrow">▶</span>

        <span>${escapeHtml(cat)}</span>

      </div>

      <span class="category-count">
        ${matched.length} ${plural(matched.length,"доклад","доклада","докладов")}
      </span>

    `;


    const content=document.createElement("div");

    content.className="category-content";


    header.onclick=()=>{

      sec.classList.toggle("open");

    };


    matched.forEach(([x,i])=>{

      const div=document.createElement("div");

      div.className="report";


      const filled=fill(x);


      div.innerHTML=`

        <div class="report-title">
          ${escapeHtml(cat)}
        </div>

        <div class="report-text">
          ${escapeHtml(filled)}
        </div>

        <div class="report-actions">

          <button
            class="primary copy-btn"
            onclick='copyText(${JSON.stringify(filled)}, this)'>
            📋 Копировать
          </button>

          <button
            class="secondary"
            onclick='editPrompt(${JSON.stringify(x)})'>
            ✏️ Изменить
          </button>

        </div>

      `;


      content.appendChild(div);

    });


    sec.appendChild(header);
    sec.appendChild(content);

    root.appendChild(sec);

  });

}


function plural(n,a,b,c){

  const n10=n%10;
  const n100=n%100;

  if(n10===1 && n100!==11)return a;

  if(n10>=2 && n10<=4 && !(n100>=12 && n100<=14))
    return b;

  return c;

}


function escapeHtml(s){

  return s.replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}


async function copyText(text,button=null){

  let ok=false;


  try{

    if(navigator.clipboard && window.isSecureContext){

      await navigator.clipboard.writeText(text);

      ok=true;

    }

  }catch(e){}


  if(!ok){

    const t=document.createElement("textarea");

    t.value=text;

    t.setAttribute("readonly","");

    t.style.position="fixed";
    t.style.left="-9999px";

    document.body.appendChild(t);

    t.focus();
    t.select();
    t.setSelectionRange(0,t.value.length);

    try{

      ok=document.execCommand("copy");

    }catch(e){

      ok=false;

    }

    t.remove();

  }


  if(ok){

    showToast("✓ Скопировано в буфер обмена");


    if(button){

      const old=button.innerHTML;

      button.innerHTML="✓ Скопировано";

      button.classList.add("copied");


      setTimeout(()=>{

        button.innerHTML=old;

        button.classList.remove("copied");

      },1200);

    }

  }else{

    showToast("Не удалось скопировать — выдели текст вручную");

  }

}


function copyAllVisible(){

  const gender=document.getElementById("gender").value;

  const q=document.getElementById("search").value.toLowerCase().trim();

  let out=[];


  data[gender].forEach(([cat,items])=>{

    items.forEach(x=>{

      if((cat+" "+x).toLowerCase().includes(q)){

        out.push(fill(x));

      }

    });

  });


  document
    .querySelectorAll("#customList .custom-copy-source")
    .forEach(x=>out.push(x.value));


  copyText(out.join("\n"));

}


function editPrompt(raw){

  const result=prompt(
    "Измените текст доклада:",
    fill(raw)
  );


  if(result!==null){

    copyText(result);

  }

}


function saveSettings(){

  localStorage.setItem(
    "cgb_settings",
    JSON.stringify(vals())
  );

  showToast("Данные сохранены");

}


function loadSettings(){

  try{

    const v=JSON.parse(
      localStorage.getItem("cgb_settings")||"{}"
    );


    ids.forEach(id=>{

      if(v[id]!==undefined){

        document.getElementById(id).value=v[id];

      }

    });

  }catch(e){}

}


function clearSettings(){

  ids.forEach(id=>{

    if(id!=="gender"){

      document.getElementById(id).value="";

    }

  });


  render();

  showToast("Поля очищены");

}


function customData(){

  return JSON.parse(
    localStorage.getItem("cgb_custom")||"[]"
  );

}


function saveCustom(){

  const title=document
    .getElementById("customTitle")
    .value
    .trim();


  let text=document
    .getElementById("customText")
    .value
    .trim();


  if(!title||!text){

    showToast("Заполни название и текст");

    return;

  }


  const arr=customData();

  arr.push({
    title,
    text
  });


  localStorage.setItem(
    "cgb_custom",
    JSON.stringify(arr)
  );


  document.getElementById("customTitle").value="";
  document.getElementById("customText").value="";


  renderCustom();

  showToast("Свой доклад добавлен");

}


function renderCustom(){

  const root=document.getElementById("customList");

  root.innerHTML="";


  customData().forEach((item,i)=>{

    const div=document.createElement("div");

    div.className="saved-item";


    const text=fill(item.text);


    div.innerHTML=`

      <div>

        <b>${escapeHtml(item.title)}</b>

        <div style="
          color:#667780;
          font-size:13px;
          margin-top:4px
        ">
          ${escapeHtml(text)}
        </div>

      </div>

      <div style="
        display:flex;
        gap:6px;
        align-items:center
      ">

        <button
          class="primary copy-btn"
          onclick='copyText(${JSON.stringify(text)}, this)'>
          📋
        </button>

        <button
          class="danger"
          onclick="deleteCustom(${i})">
          ✕
        </button>

        <input
          class="custom-copy-source hidden"
          value="${escapeHtml(text)}">

      </div>

    `;


    root.appendChild(div);

  });

}


function deleteCustom(i){

  const arr=customData();

  arr.splice(i,1);

  localStorage.setItem(
    "cgb_custom",
    JSON.stringify(arr)
  );

  renderCustom();

}


function showToast(t){

  const x=document.getElementById("toast");

  x.textContent=t;

  x.classList.add("show");


  setTimeout(
    ()=>x.classList.remove("show"),
    1400
  );

}


document
  .getElementById("gender")
  .addEventListener("change",render);


document
  .getElementById("search")
  .addEventListener("input",render);


ids
  .filter(x=>x!=="gender")
  .forEach(id=>
    document
      .getElementById(id)
      .addEventListener("input",render)
  );


loadSettings();

render();

renderCustom();

</script>

</body>
</html>
